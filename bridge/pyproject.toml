[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge-commander"
version = "0.1.0"
description = "Browser-based tabletop bridge simulator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "websockets>=14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "httpx>=0.27",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[project.scripts]
bridge = "bridge.server.main:main"

[tool.setuptools]
packages = ["bridge", "bridge.server", "bridge.shared"]

[tool.setuptools.package-dir]
bridge = "."
"bridge.server" = "server"
"bridge.shared" = "shared"

[tool.setuptools.package-data]
bridge = [
    ".env.example",
    "CREDITS.md",
    "MANUAL.md",
    "activity/dist/*",
    "favico.ico",
    "favico.png",
    "img/*/*.gif",
    "img/*/*.png",
    "resources/*.json",
    "server/admin-ui/*",
]
