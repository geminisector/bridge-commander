[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge-commander"
version = "0.1.0"
description = "Browser-based tabletop bridge simulator"
readme = "bridge/README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "websockets>=14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "httpx>=0.27",
    "mypy>=1.14",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[project.scripts]
bridge = "bridge.server.main:main"

[tool.setuptools.packages.find]
include = ["bridge*"]

[tool.setuptools.package-data]
bridge = [
    ".env.example",
    "CREDITS.md",
    "MANUAL.md",
    "activity/dist/*",
    "favico.ico",
    "favico.png",
    "img/*/*.gif",
    "img/*/*.png",
    "resources/*.json",
    "server/admin-ui/*",
]
# The shipped setting lives in the project-root `mods/` folder.  It is not part
# of the `bridge` package, so setup.py's build hook copies `mods/core` (and the
# authoring schemas) into `bridge/flavors/` for the wheel.  The example settings
# (`wc`, `stk`, `sw`, `wc2`) are deliberately not published.

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"bridge/shared/__init__.py" = ["F401"]
"tests/test_bridge_fun.py" = ["F403", "F405"]
"tests/test_engine.py" = ["F403", "F405"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_configs = true
